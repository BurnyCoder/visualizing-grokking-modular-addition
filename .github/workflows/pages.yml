# pages.yml — build the website on GitHub Actions and publish it to GitHub Pages.
# Global context: the site's HTML is generated from content/ by src/grokviz/site_build.py (no torch needed); its data
# (≈250 MB of arrays and weights) lives in a Hugging Face dataset pinned by site-data.lock and is downloaded here.
# Sources: actions/upload-pages-artifact + actions/deploy-pages
# (https://docs.github.com/en/pages/getting-started-with-github-pages/using-custom-workflows-with-github-pages);
# astral-sh/setup-uv (https://github.com/astral-sh/setup-uv).
name: Deploy site
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install (no torch needed to build the site)
        run: uv sync --no-dev
      - name: Download pinned site data from Hugging Face
        run: |
          uv run python - <<'PY'
          import json, pathlib
          from huggingface_hub import snapshot_download
          lock = json.loads(pathlib.Path("site-data.lock").read_text())
          snapshot_download(lock["repo"], repo_type="dataset", revision=lock["revision"], local_dir="site")
          PY
      - name: Build the site
        run: uv run python -m grokviz.site_build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

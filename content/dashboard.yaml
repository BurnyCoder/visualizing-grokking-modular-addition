# dashboard.yaml — layout of the Big Dashboard: groups of panels (figure ids from figures.yaml).
# Global context: every panel is the same figure implementation the chapters use, bound to one shared state
# (run, step, a, b, a′, head, neuron, frequency) controlled by the sticky bar at the top of the page.
intro: >-
  Every visualization on this site, on one page and linked together. Pick a run and drag the slider to move
  through training — every panel shows that moment. Click a cell, bar, dot or curve to select an input,
  neuron, frequency or step everywhere. Each panel's “How to read it” explains the quantity and links to the
  step-by-step chapter that derives it. New here? Press **Guided tour**, or start with the
  [chapters](chapters/00-overview.html).
groups:
  - id: training
    title: "A. Training: losses, accuracy and progress measures"
    blurb: "What happens over 40,000+ steps of full-batch training: memorisation, a long plateau, then grokking — and the measurements that reveal the hidden progress during the plateau."
    panels: [loss-curves, acc-curves, progress-measures, excluded-per-freq, gini-curves, ssw-curves, trig-loss-ratio, trig-fraction, cos-coeffs, fve-curves, loss-curves-linear]
  - id: weights
    title: "B. Weights seen through the Fourier basis"
    blurb: "The learned matrices, written in the basis of waves. Sparsity here — a few frequencies, nothing else — is the first clue to the algorithm."
    panels: [we-fourier-bars, wl-fourier-bars, we-fourier-heatmap, wl-fourier-heatmap, we-svals, attn-C-fourier, ov-fourier, wlogit-sorted, pos-embed]
  - id: activations
    title: "C. Activations on every input"
    blurb: "What the attention heads and MLP neurons compute for each of the 12,769 inputs, computed live in your browser from the selected checkpoint's weights."
    panels: [attn-grid, attn-grids-all, avg-attn, neuron-grid, neuron-small-multiples, neuron-freq-scatter, quad-scatter, cluster-sizes]
  - id: geometry
    title: "D. Geometry: circles, clouds and confidence"
    blurb: "Low-dimensional pictures of the representations: numbers become angles on circles, and the output distribution sharpens."
    panels: [embed-circles, mlp-circles, embed-pca, logit-pca, prob-pca, pcorrect-grid, entropy-grid, split-grid]
  - id: output
    title: "E. The answer for one input"
    blurb: "The selected input (a, b): its 113 logits, their fit by a sum of cosines, and the constructive interference that singles out a + b."
    panels: [output-dist, interference]
  - id: gradients
    title: "F. Gradients and weight decay"
    blurb: "The forces acting on the weights at each checkpoint, recomputed exactly (training is full-batch)."
    panels: [grad-alignment, grad-we-fourier-heatmap, grad-norms]
  - id: interventions
    title: "G. Causal tests"
    blurb: "Change one part of the computation and watch the output: ablations and counterfactual patching."
    panels: [freq-ablation-bars, patching-result, patching-live]
  - id: seeds
    title: "H. All runs and controls"
    blurb: "The paper's run next to our replications with different random seeds, and controls without weight decay or with random labels."
    panels: [seed-test-loss, seed-key-freqs, hypothesis-table]

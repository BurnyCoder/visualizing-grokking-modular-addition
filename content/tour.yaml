# tour.yaml — the dashboard's guided tour: each step sets the shared state, focuses one panel and may play a range.
# Global context: a short narrative through training for the paper's run. Fields: title; panel (a dashboard panel id,
# checked by the build); state (keys of web/js/core/state.js, applied first); play {from, to, speed} in training steps,
# played on the page's player (under reduced motion it jumps to `to`); text in markdown with the site's macros, so
# numbers come from site/data/summary.json via {{num:key}} (step values in `state`/`play` are checkpoint positions:
# the paper's checkpoint "epoch e" holds the weights after e+1 steps).
- title: "Grokking in one view"
  panel: hero-grokking
  state: {run: paper}
  play: {from: 0, to: 15400, speed: 2}
  text: "The paper's run plays from its first step to just after grokking. The four views show the same moment; the line under ▶ names the phase. Press → for a slower walk through the same story."
- title: "The puzzle"
  panel: loss-curves
  state: {step: 1601}
  text: "By step {{num:paper.t1}} the training loss is tiny but the test loss is huge: the network has memorised its {{num:task.n_train}} training sums and fails on most of the other {{num:task.n_test}}."
- title: "A long plateau"
  panel: acc-curves
  play: {from: 1600, to: 9300, speed: 4}
  text: "For thousands of steps little seems to happen: training accuracy stays at 100 % while test accuracy creeps up only slowly, from {{num:paper.acc_test_t1}} at about step {{num:paper.t1}} to {{num:paper.acc_test_t2}} at step {{num:paper.t2}}."
- title: "…but the weights are changing"
  panel: we-fourier-heatmap
  play: {from: 0, to: 15400, speed: 3}
  text: "The embedding's Fourier spectrum over training (the bright column is the current step): during the plateau a few frequencies — bright rows — separate from the rest, long before the test loss collapses."
- title: "Hidden progress"
  panel: progress-measures
  state: {step: 7001}
  text: "The restricted loss — the loss using only those few frequencies — is already falling, and the excluded loss is rising: the training answers increasingly come from the Fourier circuit, not memorisation. The restricted loss falls tenfold by step {{num:paper.restricted_drop_step}}; the test loss only by step {{num:paper.test_drop_step}}."
- title: "Numbers become angles"
  panel: embed-circles
  play: {from: 1000, to: 15000, speed: 2}
  text: "Projected onto the right planes, the 113 embeddings spread out onto circles: the network represents a number a by the angle 2πk·a/113."
- title: "Confidence everywhere"
  panel: pcorrect-grid
  play: {from: 0, to: 15400, speed: 2}
  text: "Each pixel is one input. The training pairs (the speckle) are answered correctly early on; the test pairs light up only during cleanup."
- title: "Grokking"
  panel: loss-curves
  state: {step: 10601}
  text: "Test accuracy passes 99 % at step {{num:paper.t_grok}}: weight decay strips away the memorising weights and the test loss collapses — after the circuit already existed."
- title: "Cleanup"
  panel: ssw-curves
  play: {from: 9300, to: 14100, speed: 2}
  text: "The sum of squared weights falls steeply: the memorisation solution is expensive and weight decay removes it."
- title: "Periodic neurons"
  panel: neuron-grid
  state: {step: 40001, neuron: 0}
  text: "Most neurons' activation over all inputs is a pattern of stripes: {{num:paper.neurons_085}} of the 512 are mostly a function of cos and sin of one frequency."
- title: "Periodic attention"
  panel: attn-grid
  state: {step: 40001, head: 0}
  text: "The attention heads are periodic too: how much '=' attends to the first number depends on a and b through waves."
- title: "Interference"
  panel: interference
  state: {step: 40001, a: 100, b: 50}
  text: "For any input, each key frequency contributes a cosine wave over the candidate answers; all of them peak together only at a + b."
- title: "Causal check"
  panel: freq-ablation-bars
  state: {step: 40001}
  text: "Remove one key frequency from the logits and the loss explodes; remove any other frequency and nothing happens."
- title: "Late surprise"
  panel: avg-attn
  play: {from: 40000, to: 50000, speed: 2}
  text: "Training is not over after 40,000 steps: late on, two heads attend to '=' again (heads 0–3: {{num:paper.attn_eq_45k}} at step 45,001, up from {{num:paper.attn_eq_pct}} at 40,001) — a small change that neither the paper nor ARENA explains."
- title: "Not a fluke"
  panel: seed-test-loss
  state: {step: 40001}
  text: "Every one of our weight-decay seeds groks, at different times and with different key frequencies, and no run without weight decay does (hypothesis H5 in the table below)."
